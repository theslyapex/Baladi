name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.godot'
      - '**.json'
      - 'export_presets.cfg'
      - '.github/workflows/android-debug.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare build directory
        run: mkdir -p build
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export Android debug APK
        run: godot --headless --path . --export-debug "Android" build/baladi-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baladi-android-debug
          path: build/baladi-debug.apk
          if-no-files-found: error
