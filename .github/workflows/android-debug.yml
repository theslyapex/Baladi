name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.godot'
      - '**.json'
      - '**.tres'
      - '**.svg'
      - 'assets/**'
      - 'export_presets.cfg'
      - '.github/workflows/android-debug.yml'

concurrency:
  group: baladi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java toolchain
        run: |
          java -version
          javac -version
          jar --version

      - name: Prepare Java downloader
        run: |
          cat > /tmp/Download.java <<'EOF'
          import java.net.URI;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.StandardCopyOption;
          public class Download {
            public static void main(String[] args) throws Exception {
              try (var input = URI.create(args[0]).toURL().openStream()) {
                Files.copy(input, Path.of(args[1]), StandardCopyOption.REPLACE_EXISTING);
              }
            }
          }
          EOF
          javac /tmp/Download.java

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: baladi-android-debug-keystore-v1

      - name: Create stable Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storetype JKS \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Baladi Debug, OU=Alishams Game Studio, O=Alishams, L=Shiraz, ST=Fars, C=IR"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          java -cp /tmp Download "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          (cd /tmp/godot-templates && jar xf /tmp/godot-templates.tpz)
          find /tmp/godot-templates -type f \( -name 'android_debug.apk' -o -name 'android_release.apk' \) -exec cp {} "$HOME/.local/share/godot/export_templates/4.7.2.stable/" \;
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"

      - name: Download Estedad Persian font
        run: |
          mkdir -p assets/fonts build
          java -cp /tmp Download "https://raw.githubusercontent.com/aminabedi68/Estedad/master/fonts/webfonts/Estedad%5Bwght%5D.woff2" assets/fonts/Estedad.woff2
          test -s assets/fonts/Estedad.woff2

      - name: Download Icons8 coin icon
        run: |
          mkdir -p assets/icons
          java -cp /tmp Download "https://img.icons8.com/fluency/96/coins.png" assets/icons/coin.png
          test -s assets/icons/coin.png

      - name: Prepare build directory
        run: mkdir -p build

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Validate Persian level vocabulary
        run: godot --headless --path . --script res://scripts/validate_levels.gd

      - name: Verify Android export environment
        run: |
          test -n "$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          sed -i "s#^version/code=.*#version/code=${GITHUB_RUN_NUMBER}#" export_presets.cfg
          godot --headless --path . --export-debug "Android" build/baladi-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baladi-android-debug
          path: build/baladi-debug.apk
          if-no-files-found: error
